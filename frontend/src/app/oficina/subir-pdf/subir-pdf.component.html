<div class="container py-4" style="max-width: 480px;">
  <h1 class="h4 mb-3">Subir archivo de corte</h1>
  <p class="text-muted">
    Los datos extraídos del PDF son una propuesta editable: revisala en la siguiente pantalla
    antes de confirmar la orden.
  </p>

  <div class="mb-3">
    <input
      type="file"
      accept="application/pdf"
      class="form-control"
      (change)="onArchivoSeleccionado($event)"
    />
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="!archivoSeleccionado || enviando"
    (click)="subir()"
  >
    {{ enviando ? 'Procesando…' : 'Subir y extraer datos' }}
  </button>
</div>
