<div class="container py-4" style="max-width: 480px;">
  <h1 class="h4 mb-3">Subir archivo de corte</h1>
  <p class="text-muted">
    Los datos extraídos del PDF son una propuesta editable: revisala en la siguiente pantalla
    antes de confirmar la orden.
  </p>

  <div class="mb-3">
    <label for="archivoPdf" class="form-label">Archivo PDF del corte</label>
    <input
      id="archivoPdf"
      type="file"
      accept="application/pdf"
      class="form-control"
      [disabled]="enviando"
      (change)="onArchivoSeleccionado($event)"
    />
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div *ngIf="enviando" class="d-flex align-items-center gap-3">
    <p class="text-muted m-0">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      Procesando…
    </p>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelar()">
      Cancelar
    </button>
  </div>
</div>
