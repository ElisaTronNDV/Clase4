<div class="container py-4" style="max-width: 720px;">
  <h1 class="h4 mb-3">Revisar orden de trabajo</h1>
  <p class="text-muted">
    Estos son los datos extraídos del archivo de corte. Revisalos y corregí lo que haga falta
    antes de confirmar: nada se guarda hasta que confirmes.
  </p>

  <form [formGroup]="form" (ngSubmit)="confirmar(false)">
    <fieldset class="mb-4">
      <legend class="h6">Datos generales</legend>
      <div class="row g-3">
        <div class="col-md-4">
          <label for="multiplicidad" class="form-label">Multiplicidad</label>
          <input id="multiplicidad" type="number" class="form-control" formControlName="multiplicidad" />
        </div>
        <div class="col-md-4">
          <label for="espesorMm" class="form-label">Espesor [mm]</label>
          <input id="espesorMm" type="number" step="0.01" class="form-control" formControlName="espesor_mm" />
        </div>
        <div class="col-md-4">
          <label for="material" class="form-label">Material</label>
          <input id="material" type="text" class="form-control" formControlName="material" />
        </div>
        <div class="col-md-4">
          <label for="largoMm" class="form-label">Largo [mm]</label>
          <input id="largoMm" type="number" step="0.01" class="form-control" formControlName="largo_mm" />
        </div>
        <div class="col-md-4">
          <label for="anchoMm" class="form-label">Ancho [mm]</label>
          <input id="anchoMm" type="number" step="0.01" class="form-control" formControlName="ancho_mm" />
        </div>
        <div class="col-md-4">
          <label for="tiempoEjecucion" class="form-label">Tiempo de ejecución estimado</label>
          <input
            id="tiempoEjecucion"
            type="text"
            class="form-control"
            formControlName="tiempo_ejecucion_estimado"
            placeholder="hh:mm:ss"
          />
        </div>
      </div>
    </fieldset>

    <fieldset class="mb-4">
      <legend class="h6">Piezas</legend>
      <div formArrayName="piezas">
        <div
          class="row g-2 align-items-center mb-2"
          *ngFor="let pieza of piezas.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="col-7">
            <input
              type="text"
              class="form-control"
              formControlName="descripcion"
              placeholder="Descripción"
              [attr.aria-label]="'Descripción de la pieza ' + (i + 1)"
            />
          </div>
          <div class="col-3">
            <input
              type="number"
              class="form-control"
              formControlName="cantidad"
              placeholder="Cantidad"
              [attr.aria-label]="'Cantidad de la pieza ' + (i + 1)"
            />
          </div>
          <div class="col-2">
            <button
              type="button"
              class="btn btn-outline-danger btn-sm"
              [attr.aria-label]="'Quitar pieza ' + (i + 1)"
              (click)="eliminarPieza(i)"
            >
              Quitar
            </button>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="agregarPieza()">
        Agregar pieza
      </button>
    </fieldset>

    <fieldset class="mb-4">
      <legend class="h6">Recortes sobrantes</legend>
      <div formArrayName="recortes">
        <div
          class="row g-2 align-items-center mb-2"
          *ngFor="let recorte of recortes.controls; let i = index"
          [formGroupName]="i"
        >
          <div class="col-5">
            <input
              type="number"
              step="0.01"
              class="form-control"
              formControlName="largo_mm"
              placeholder="Largo [mm]"
              [attr.aria-label]="'Largo en mm del recorte ' + (i + 1)"
            />
          </div>
          <div class="col-5">
            <input
              type="number"
              step="0.01"
              class="form-control"
              formControlName="ancho_mm"
              placeholder="Ancho [mm]"
              [attr.aria-label]="'Ancho en mm del recorte ' + (i + 1)"
            />
          </div>
          <div class="col-2">
            <button
              type="button"
              class="btn btn-outline-danger btn-sm"
              [attr.aria-label]="'Quitar recorte ' + (i + 1)"
              (click)="eliminarRecorte(i)"
            >
              Quitar
            </button>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="agregarRecorte()">
        Agregar recorte
      </button>
    </fieldset>

    <div class="alert alert-warning" *ngIf="advertenciaProductoInexistente">
      {{ errorMessage }}
      <div class="mt-2">
        <button
          type="button"
          class="btn btn-warning btn-sm"
          [disabled]="enviando"
          (click)="confirmar(true)"
        >
          Confirmar de todos modos y dar de alta el producto
        </button>
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage && !advertenciaProductoInexistente">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="enviando">
      {{ enviando ? 'Confirmando…' : 'Confirmar orden' }}
    </button>
  </form>
</div>
