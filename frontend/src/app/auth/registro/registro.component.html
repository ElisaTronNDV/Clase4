<div class="container py-5" style="max-width: 420px;">
  <h1 class="h3 mb-4">Crear cuenta</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email" />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña (mínimo 8 caracteres)</label>
      <input id="password" type="password" class="form-control" formControlName="password" />
      <div
        class="form-text text-danger"
        *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')"
      >
        La contraseña debe tener al menos 8 caracteres.
      </div>
    </div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Registrarme</button>
    <a routerLink="/login" class="btn btn-link">Ya tengo cuenta</a>
  </form>
</div>
