<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__brand-mark">DyP</span>
      <span class="auth-card__brand-name">Diseños y Procesos</span>
    </div>
    <h1 class="h5 mb-4 text-center">Crear cuenta</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña (mínimo 8 caracteres)</label>
        <input id="password" type="password" class="form-control" formControlName="password" />
        <div
          class="form-text text-danger"
          *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')"
        >
          La contraseña debe tener al menos 8 caracteres.
        </div>
      </div>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">
        Registrarme
      </button>
      <div class="text-center mt-3">
        <a routerLink="/login" class="link-secondary">Ya tengo cuenta</a>
      </div>
    </form>
  </div>
</div>
