<div class="container py-4" style="max-width: 560px;">
  <h1 class="h4 mb-4">Nuevo producto</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="material" class="form-label">Material</label>
      <input id="material" type="text" class="form-control" formControlName="material" />
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="espesor_mm" class="form-label">Espesor [mm]</label>
        <input id="espesor_mm" type="number" step="0.01" class="form-control" formControlName="espesor_mm" />
      </div>
      <div class="col-md-4 mb-3">
        <label for="largo_mm" class="form-label">Largo [mm]</label>
        <input id="largo_mm" type="number" step="0.01" class="form-control" formControlName="largo_mm" />
      </div>
      <div class="col-md-4 mb-3">
        <label for="ancho_mm" class="form-label">Ancho [mm]</label>
        <input id="ancho_mm" type="number" step="0.01" class="form-control" formControlName="ancho_mm" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="stock_fisico" class="form-label">Stock físico</label>
        <input id="stock_fisico" type="number" step="0.01" class="form-control" formControlName="stock_fisico" />
      </div>
      <div class="col-md-6 mb-3">
        <label for="punto_pedido" class="form-label">Punto de pedido</label>
        <input id="punto_pedido" type="number" step="0.01" class="form-control" formControlName="punto_pedido" />
      </div>
    </div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Dar de alta</button>
    <a routerLink="/inventario/listado" class="btn btn-link">Cancelar</a>
  </form>
</div>
