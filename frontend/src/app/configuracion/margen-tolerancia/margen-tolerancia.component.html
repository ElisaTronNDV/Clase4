<div class="container py-4" style="max-width: 480px;">
  <h1 class="h4 mb-4">Margen de tolerancia dimensional</h1>

  <p *ngIf="cargando">Cargando…</p>

  <form [formGroup]="form" (ngSubmit)="guardar()" *ngIf="!cargando">
    <div class="mb-3">
      <label for="margen_tolerancia_mm" class="form-label">Margen [mm]</label>
      <input
        id="margen_tolerancia_mm"
        type="number"
        step="0.01"
        class="form-control"
        formControlName="margen_tolerancia_mm"
      />
      <div class="form-text">
        Usado por las búsquedas de coincidencia de producto en Oficina y Taller. Sin límite
        superior; debe ser mayor a cero.
      </div>
    </div>
    <div class="alert alert-success" *ngIf="guardadoOk">Margen actualizado correctamente.</div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || guardando">
      Guardar
    </button>
  </form>
</div>
